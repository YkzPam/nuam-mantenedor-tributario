name: Verificar mantenedor
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  pruebas:
    name: Pruebas en ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      # En Windows se usa el mismo acceso que el equipo: verificar.cmd prepara .venv y ejecuta las cuatro suites.
      - name: Preparar y ejecutar las cuatro suites con verificar.cmd
        if: runner.os == 'Windows'
        shell: cmd
        run: call verificar.cmd
      - name: Instalar dependencias fijadas
        if: runner.os != 'Windows'
        run: python -m pip install -r requirements-lock.txt
      - name: Ejecutar las cuatro suites
        if: runner.os != 'Windows'
        run: python run_all_tests.py
      - name: Conservar el informe de esta ejecución
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-${{ matrix.os }}
          path: |
            evidencias/ejecucion_completa_*
            !evidencias/ejecucion_completa_20261111_214727_152229
          if-no-files-found: warn
